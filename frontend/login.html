<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krishna Chains · Sign In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C; --gold-b: #E4C87A; --gold-d: #9E7E38;
      --navy: #080C16; --navy2: #111827; --navy3: #1A2438;
      --ivory: #F2EDE3; --ivory2: #BFB9AC; --bronze: #7A6040;
    }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--navy);
      color: var(--ivory);
      overflow: hidden;
    }

    /* Full-screen particle canvas */
    #cvs {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    /* Subtle radial glow behind the card */
    .bg-glow {
      position: fixed; inset: 0; z-index: 0;
      background: radial-gradient(ellipse at 50% 50%, rgba(201,168,76,.07) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Centre everything */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }

    /* Glassmorphism card */
    .card {
      width: 100%; max-width: 400px;
      background: rgba(18, 28, 48, 0.72);
      backdrop-filter: blur(24px) saturate(1.4);
      -webkit-backdrop-filter: blur(24px) saturate(1.4);
      border: 1px solid rgba(201, 168, 76, .18);
      border-radius: 20px;
      padding: 2.8rem 2.5rem 2.5rem;
      box-shadow:
        0 8px 32px rgba(0,0,0,.55),
        0 0 0 1px rgba(201,168,76,.06) inset,
        0 1px 0 rgba(201,168,76,.15) inset;
      animation: rise .5s ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px) scale(.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Brand */
    .card-logo {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.05rem; letter-spacing: .32em;
      color: var(--gold); text-transform: uppercase;
      text-align: center; line-height: 1;
    }

    .card-logo-sub {
      font-size: .58rem; letter-spacing: .18em; color: var(--ivory2);
      text-transform: uppercase; text-align: center;
      margin-top: 4px; opacity: .6;
    }

    .divider {
      width: 36px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,168,76,.5), transparent);
      margin: 1.2rem auto 1.8rem;
    }

    .card-h {
      font-family: Georgia, serif; font-size: 1.4rem;
      font-weight: normal; color: var(--ivory);
      text-align: center; margin-bottom: .3rem;
    }

    .card-s {
      font-size: .74rem; color: var(--ivory2);
      text-align: center; margin-bottom: 2rem; opacity: .8;
    }

    /* Form */
    .fg { margin-bottom: 1.1rem; }

    label {
      display: block; font-size: .65rem; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ivory2);
      margin-bottom: .42rem; font-weight: 600;
    }

    input {
      width: 100%;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(201,168,76,.18);
      border-radius: 8px;
      padding: .74rem 1rem;
      color: var(--ivory); font-size: .88rem; font-family: inherit;
      outline: none;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    input:focus {
      border-color: var(--gold);
      background: rgba(255,255,255,.08);
      box-shadow: 0 0 0 3px rgba(201,168,76,.1);
    }

    input::placeholder { color: rgba(191,185,172,.35); }

    .pw-wrap { position: relative; }
    .pw-tog {
      position: absolute; right: .8rem; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--ivory2); cursor: pointer;
      font-size: .67rem; letter-spacing: .06em; text-transform: uppercase;
      font-family: inherit; transition: color .18s; padding: .2rem;
    }
    .pw-tog:hover { color: var(--gold); }

    /* Error */
    .error-msg {
      background: rgba(192,57,43,.1);
      border: 1px solid rgba(229,90,79,.3);
      border-radius: 8px; padding: .62rem .85rem;
      font-size: .76rem; color: #E55A4F;
      margin-bottom: 1rem; display: none;
      animation: shake .3s ease;
    }
    .error-msg.show { display: block; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-6px); }
      75%      { transform: translateX(6px); }
    }

    /* Button */
    .btn-login {
      width: 100%; background: var(--gold);
      border: none; color: var(--navy);
      padding: .84rem; font-size: .76rem; letter-spacing: .14em;
      text-transform: uppercase; font-weight: 700;
      font-family: inherit; cursor: pointer;
      border-radius: 8px; transition: all .2s;
      margin-top: .3rem;
    }
    .btn-login:hover:not(:disabled) {
      background: var(--gold-b);
      box-shadow: 0 6px 28px rgba(201,168,76,.45);
      transform: translateY(-1px);
    }
    .btn-login:disabled { opacity: .6; cursor: default; transform: none; }

    .spinner {
      display: none; width: 14px; height: 14px;
      border: 2px solid rgba(8,12,22,.3);
      border-top-color: var(--navy);
      border-radius: 50%; animation: spin .65s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Footer */
    .footer {
      position: fixed; bottom: 1.4rem; left: 50%; transform: translateX(-50%);
      font-size: .63rem; color: var(--bronze); opacity: .45;
      z-index: 2; white-space: nowrap;
    }
  </style>
</head>
<body>

<canvas id="cvs"></canvas>
<div class="bg-glow"></div>
<div class="page">
  <div class="card">
    <div class="card-logo">Krishna Chains</div>
    <div class="card-logo-sub">Gold Jewellery &amp; Billing</div>
    <div class="divider"></div>
    <h2 class="card-h">Welcome back</h2>
    <p class="card-s">Sign in to your billing dashboard</p>

    <div class="error-msg" id="err">Invalid username or password. Please try again.</div>

    <form onsubmit="doLogin(event)">
      <div class="fg">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="rkc" autocomplete="username" required>
      </div>
      <div class="fg">
        <label for="password">Password</label>
        <div class="pw-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="pw-tog" onclick="togglePw()">Show</button>
        </div>
      </div>
      <button type="submit" class="btn-login" id="login-btn">
        <span id="btn-text">Sign In</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>
  </div>
</div>

<div class="footer">© 2024 Krishna Chains · All rights reserved</div>

<script>
  if (sessionStorage.getItem('kc_token')) {
    window.location.href = '/app';
  }

  // Particle canvas
  const cvs = document.getElementById('cvs');
  const ctx = cvs.getContext('2d');
  function rsz() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
  rsz(); window.addEventListener('resize', rsz);

  class P {
    constructor() { this.reset(); }
    reset() {
      this.x = Math.random() * cvs.width;
      this.y = Math.random() * cvs.height;
      this.s = Math.random() * 1.5 + .3;
      this.vx = (Math.random() - .5) * .3;
      this.vy = (Math.random() - .5) * .3;
      this.life = 0;
      this.max = Math.random() * 200 + 100;
      this.gold = Math.random() > .35;
    }
    tick() { this.x += this.vx; this.y += this.vy; this.life++; if (this.life > this.max) this.reset(); }
    draw() {
      const a = Math.sin(this.life / this.max * Math.PI) * .7;
      ctx.beginPath(); ctx.arc(this.x, this.y, this.s, 0, Math.PI * 2);
      ctx.fillStyle = this.gold
        ? `rgba(201,168,76,${a})`
        : `rgba(242,237,227,${a * .25})`;
      ctx.fill();
    }
  }

  const pts = Array.from({ length: 140 }, () => {
    const p = new P; p.life = Math.random() * p.max; return p;
  });

  (function loop() {
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    pts.forEach(p => { p.tick(); p.draw(); });
    requestAnimationFrame(loop);
  })();

  function togglePw() {
    const i = document.getElementById('password'), b = i.nextElementSibling;
    i.type = i.type === 'password' ? 'text' : 'password';
    b.textContent = i.type === 'password' ? 'Show' : 'Hide';
  }

  async function doLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('login-btn');
    const txt = document.getElementById('btn-text');
    const spin = document.getElementById('spinner');
    const err = document.getElementById('err');

    err.classList.remove('show');
    btn.disabled = true;
    txt.style.display = 'none';
    spin.style.display = 'block';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });

      if (!res.ok) throw new Error();

      const data = await res.json();
      sessionStorage.setItem('kc_token', data.token);
      sessionStorage.setItem('kc_user', data.username);
      window.location.href = '/app';

    } catch {
      err.classList.add('show');
      btn.disabled = false;
      txt.style.display = 'block';
      spin.style.display = 'none';
    }
  }
</script>
</body>
</html>
