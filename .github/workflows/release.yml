name: Build Mac App

on:
  push:
    tags:
      - 'v*.*.*'        # triggers on: git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:    # also allows manual trigger from GitHub Actions tab

permissions:
  contents: write       # needed to create GitHub Releases

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller
        run: pyinstaller billing.spec

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r "Krishna-Chains.zip" "Krishna Chains.app"

      # --- Only runs when a version tag is pushed ---
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Krishna Chains ${{ github.ref_name }}"
          body: |
            ## Krishna Chains Billing — ${{ github.ref_name }}

            ### How to install (Mac)
            1. Download **Krishna-Chains.zip** below
            2. Unzip it (double-click the zip)
            3. Double-click **Krishna Chains.app** to launch
            4. Your billing data is saved in `~/Documents/Krishna Chains/` — it is never deleted when you update the app

            **Login:** username `rkc` · password `rkc0345`
          files: dist/Krishna-Chains.zip
          draft: false
          prerelease: false

      # --- Runs on manual trigger (no tag) — stores artifact for 7 days ---
      - name: Upload artifact (manual builds)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: Krishna-Chains-Mac
          path: dist/Krishna-Chains.zip
          retention-days: 7
