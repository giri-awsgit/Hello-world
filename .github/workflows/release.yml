name: Build Mac App

on:
  push:
    tags:
      - 'v*.*.*'        # triggers on: git tag v1.0.0 && git push origin v1.0.0
  workflow_dispatch:    # also allows manual trigger from GitHub Actions tab

permissions:
  contents: write       # needed to create GitHub Releases

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app with PyInstaller
        run: pyinstaller billing.spec

      - name: Zip the .app bundle
        run: |
          cp Install.command dist/Install.command
          chmod +x dist/Install.command
          cd dist
          zip -r "Krishna-Chains.zip" "Krishna Chains.app" Install.command

      # --- Only runs when a version tag is pushed ---
      # Uses gh CLI (pre-installed on all GitHub runners) — no external action download needed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/Krishna-Chains.zip \
            --title "Krishna Chains ${{ github.ref_name }}" \
            --notes "## Krishna Chains Billing — ${{ github.ref_name }}

          ### First-time install (Mac)
          1. Download **Krishna-Chains.zip** below
          2. Unzip it (double-click the zip)
          3. Double-click **Install.command** — this removes the macOS security block and opens the app
          4. After that, always open via **Krishna Chains.app** directly

          ### Updating
          Download the new zip, unzip, replace the old app. Your data in \`~/Documents/Krishna Chains/\` is never touched.

          Contact your administrator for login credentials."

      # --- Runs on manual trigger (no tag) — stores artifact for 7 days ---
      - name: Upload artifact (manual builds)
        uses: actions/upload-artifact@v5
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: Krishna-Chains-Mac
          path: dist/Krishna-Chains.zip
          retention-days: 7
